<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 在线考试系统</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>📝 在线考试与题库系统</h1>
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" required placeholder="admin / teacher / student">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" required placeholder="123456">
      </div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
      <div id="loginError" class="error-msg"></div>
    </form>
    <div class="login-tip">示例账号：admin/123456、teacher/123456、student/123456</div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.code !== 0 || !data.data) {
          errEl.textContent = data.detail || '登录失败';
          return;
        }
        document.cookie = `access_token=${data.data.access_token}; path=/`;
        localStorage.setItem('access_token', data.data.access_token);
        localStorage.setItem('user_role', data.data.user.role);
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = '网络错误';
      }
    });
  </script>
</body>
</html>
