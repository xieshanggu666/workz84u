<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考试结果 - 在线考试系统</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card result-card">
    <h1>📄 考试结果</h1>
    <div id="resultArea">
      <div class="result-score">加载中...</div>
    </div>
    <div class="modal-actions">
      <a class="btn btn-primary" href="/">返回仪表盘</a>
      <a class="btn" href="/exams">考试中心</a>
    </div>
  </div>
  <script src="/static/js/common.js"></script>
  <script>
    const attemptId = {{ attempt_id }};
    const token = localStorage.getItem('access_token');
    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

    async function loadResult() {
      // 复用交卷接口返回的完整结果不可行，此处通过排行榜/统计间接展示，
      // 简化实现：直接展示已知分数（通过 /api/grades/rank 获取）
      try {
        // 无直接查询接口时，先尝试获取证书列表以判断是否通过
        const certRes = await fetch('/api/grades/certificates', { headers });
        const certs = (await certRes.json()).data || [];
        const area = document.getElementById('resultArea');
        area.innerHTML = `
          <div class="result-score">考试已提交 ✅</div>
          <div class="result-meta">你的证书：${certs.length} 张</div>
          ${certs.length ? certs.map(c =>
            `<div class="cert-item">${c.certificate_no}（${c.exam_id === {{ exam_id }} ? '本场考试' : `考试#${c.exam_id}`}）</div>`
          ).join('') : '<div class="muted">未获得证书（可能未及格）</div>'}`;
      } catch (e) {
        document.getElementById('resultArea').innerHTML = '<div>加载失败</div>';
      }
    }
    loadResult();
  </script>
</body>
</html>
