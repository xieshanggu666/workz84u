{% extends "base.html" %}
{% block title %}题库管理 - 在线考试系统{% endblock %}
{% block content %}
<h2>📚 题库管理</h2>

<div class="toolbar">
  <select id="filterType">
    <option value="">全部题型</option>
    <option value="single_choice">单选题</option>
    <option value="multiple_choice">多选题</option>
    <option value="judgment">判断题</option>
    <option value="fill_blank">填空题</option>
    <option value="short_answer">简答题</option>
    <option value="programming">编程题</option>
  </select>
  <input type="text" id="filterKeyword" placeholder="搜索题目内容">
  <button class="btn btn-primary" onclick="reloadList(1)">搜索</button>
  <span class="spacer"></span>
  <button class="btn" onclick="showAddForm()">+ 新增题目</button>
</div>

<table class="table">
  <thead>
    <tr><th>ID</th><th>题型</th><th>题目</th><th>难度</th><th>操作</th></tr>
  </thead>
  <tbody id="questionTable"></tbody>
</table>
<div class="pagination">
  <button class="btn btn-sm" onclick="reloadList(currentPage-1)">上一页</button>
  <span id="pageInfo"></span>
  <button class="btn btn-sm" onclick="reloadList(currentPage+1)">下一页</button>
</div>

<!-- 新增题目弹窗 -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <h3 id="modalTitle">新增题目</h3>
    <div class="form-group">
      <label>题型</label>
      <select id="qType">
        <option value="single_choice">单选题</option>
        <option value="multiple_choice">多选题</option>
        <option value="judgment">判断题</option>
        <option value="fill_blank">填空题</option>
        <option value="short_answer">简答题</option>
        <option value="programming">编程题</option>
      </select>
    </div>
    <div class="form-group">
      <label>题目内容</label>
      <textarea id="qContent" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>难度 (1-5)</label>
      <input type="number" id="qDifficulty" min="1" max="5" value="3">
    </div>
    <div class="form-group">
      <label>知识点ID</label>
      <input type="number" id="qKpId" value="1">
    </div>
    <div class="form-group">
      <label>答案解析 / 关键词(以|分隔)</label>
      <textarea id="qAnalysis" rows="2" placeholder="填空标准答案或简答关键词用|分隔"></textarea>
    </div>
    <div id="optionsArea">
      <label>选项（每题一行，格式：内容@是否正确0/1）</label>
      <textarea id="qOptions" rows="3" placeholder="A选项@1&#10;B选项@0&#10;C选项@0&#10;D选项@0"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="submitQuestion()">保存</button>
      <button class="btn" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
const PAGE_SIZE = 10;
const token = localStorage.getItem('access_token');
const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
const role = localStorage.getItem('user_role') || 'student';
const canEdit = role === 'admin' || role === 'teacher';

async function reloadList(page) {
  if (page < 1) return;
  currentPage = page;
  const type = document.getElementById('filterType').value;
  const keyword = document.getElementById('filterKeyword').value;
  const params = new URLSearchParams({ page, page_size: PAGE_SIZE });
  if (type) params.set('question_type', type);
  if (keyword) params.set('keyword', keyword);
  const res = await fetch(`/api/questions?${params}`, { headers });
  const data = (await res.json()).data;
  const tbody = document.getElementById('questionTable');
  tbody.innerHTML = '';
  (data?.items || []).forEach(q => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${q.id}</td>
      <td>${q.question_type}</td>
      <td>${q.content.slice(0, 40)}</td>
      <td>${'★'.repeat(q.difficulty)}${'☆'.repeat(5 - q.difficulty)}</td>
      <td>${canEdit ? `<button class="btn btn-sm btn-danger" onclick="delQuestion(${q.id})">删除</button>` : ''}</td>`;
    tbody.appendChild(tr);
  });
  const totalPages = Math.max(1, Math.ceil((data?.total || 0) / PAGE_SIZE));
  document.getElementById('pageInfo').textContent = `${currentPage}/${totalPages} (共${data?.total || 0}题)`;
}

async function delQuestion(id) {
  if (!confirm('确定删除该题目？')) return;
  await fetch(`/api/questions/${id}`, { method: 'DELETE', headers });
  reloadList(currentPage);
}

function showAddForm() { document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); }

async function submitQuestion() {
  const optionsText = document.getElementById('qOptions').value.trim();
  const options = optionsText.split('\n').filter(Boolean).map((line, i) => {
    const [content, flag] = line.split('@');
    return { content: content.trim(), is_correct: parseInt(flag) || 0, order_index: i };
  });
  const body = {
    question_type: document.getElementById('qType').value,
    content: document.getElementById('qContent').value,
    difficulty: parseInt(document.getElementById('qDifficulty').value),
    knowledge_point_id: parseInt(document.getElementById('qKpId').value),
    subject_id: 1,
    analysis: document.getElementById('qAnalysis').value,
    options,
  };
  const res = await fetch('/api/questions', {
    method: 'POST', headers, body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.code === 0) { closeModal(); reloadList(currentPage); }
  else alert(data.detail || '保存失败');
}

reloadList(1);
</script>
{% endblock %}
