<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>答题中 - 在线考试系统</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="exam-header">
    <div class="exam-title" id="examTitle">考试中</div>
    <div class="exam-timer">剩余时间：<span id="timer" class="timer-text">--:--</span></div>
  </div>
  <main class="container exam-body">
    <div id="questionArea"></div>
    <div class="exam-footer">
      <button class="btn btn-primary" onclick="submitAll()">交卷</button>
    </div>
  </main>
  <script src="/static/js/common.js"></script>
  <script>
    const examId = {{ exam_id }};
    const token = localStorage.getItem('access_token');
    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
    let attempt = null;
    let questions = [];
    const answers = {};
    const qStartTime = {};
    let timerInterval = null;

    // ---- 防作弊：切屏检测 ----
    let screenSwitches = 0;
    let lastSwitchReport = 0;

    async function reportScreenSwitch() {
      if (!attempt || Date.now() - lastSwitchReport < 3000) return; // 3秒内只上报一次
      lastSwitchReport = Date.now();
      try {
        const res = await fetch(`/api/attempts/${attempt.attempt_id}/screen-switch`, {
          method: 'POST', headers
        });
        const data = await res.json();
        if (data.data?.force_submit) {
          alert('检测到多次切屏，系统已强制交卷！');
          await submitAll();
        }
      } catch (e) { /* 网络错误忽略 */ }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && attempt) reportScreenSwitch();
    });
    window.addEventListener('blur', () => {
      if (attempt) reportScreenSwitch();
    });

    // ---- 启动考试 ----
    async function start() {
      const res = await fetch(`/api/attempts/${examId}/start`, { method: 'POST', headers });
      const data = await res.json();
      if (data.code !== 0) {
        alert(data.detail || '无法开始考试');
        window.location.href = '/exams';
        return;
      }
      attempt = data.data;
      questions = data.data.questions;
      document.getElementById('examTitle').textContent = attempt.title;
      renderQuestions();
      startTimer();
    }

    function renderQuestions() {
      const area = document.getElementById('questionArea');
      area.innerHTML = '';
      questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'card question-card';
        let inputHtml = '';
        if (q.question_type === 'single_choice' || q.question_type === 'judgment') {
          inputHtml = q.options.map(opt => `
            <label class="option-row">
              <input type="radio" name="q${q.question_id}" value="${opt.id}"
                onchange="saveAnswer(${q.question_id}, this.value)">
              <span>${opt.content}</span>
            </label>`).join('');
        } else if (q.question_type === 'multiple_choice') {
          inputHtml = q.options.map(opt => `
            <label class="option-row">
              <input type="checkbox" name="q${q.question_id}" value="${opt.id}"
                onchange="saveMultiAnswer(${q.question_id})">
              <span>${opt.content}</span>
            </label>`).join('');
        } else {
          inputHtml = `<textarea class="answer-textarea" name="q${q.question_id}"
            oninput="saveAnswer(${q.question_id}, this.value)"></textarea>`;
        }
        card.innerHTML = `
          <div class="question-head">
            <span class="badge badge-type">${idx + 1}. ${q.question_type}</span>
            <span class="badge">${q.score}分</span>
          </div>
          <div class="question-content">${q.content}</div>
          ${inputHtml}`;
        area.appendChild(card);
        qStartTime[q.question_id] = Date.now();
      });
    }

    function saveAnswer(qid, value) {
      answers[qid] = value;
      const spent = Math.floor((Date.now() - (qStartTime[qid] || Date.now())) / 1000);
      answers[`${qid}_time`] = spent;
    }

    function saveMultiAnswer(qid) {
      const checks = [...document.querySelectorAll(`input[name="q${qid}"]:checked`)];
      const val = checks.map(c => c.value).join(',');
      saveAnswer(qid, val);
    }

    function startTimer() {
      const totalMs = attempt.duration_minutes * 60 * 1000;
      const endAt = Date.now() + totalMs;
      timerInterval = setInterval(() => {
        const remain = Math.max(0, endAt - Date.now());
        const m = Math.floor(remain / 60000);
        const s = Math.floor((remain % 60000) / 1000);
        document.getElementById('timer').textContent =
          `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if (remain <= 0) {
          clearInterval(timerInterval);
          alert('考试时间到，自动交卷');
          submitAll();
        }
      }, 1000);
    }

    async function submitAll() {
      if (!attempt) return;
      if (timerInterval) clearInterval(timerInterval);
      const answerList = [];
      questions.forEach(q => {
        answerList.push({
          question_id: q.question_id,
          user_answer: answers[q.question_id] || '',
          time_spent_seconds: answers[`${q.question_id}_time`] || 0,
        });
      });
      const res = await fetch(`/api/attempts/${attempt.attempt_id}/submit`, {
        method: 'POST', headers, body: JSON.stringify({ answers: answerList })
      });
      const data = await res.json();
      if (data.code === 0) {
        window.location.href = `/result/${attempt.attempt_id}`;
      } else {
        alert(data.detail || '交卷失败');
      }
    }

    start();
  </script>
</body>
</html>
