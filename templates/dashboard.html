{% extends "base.html" %}
{% block title %}仪表盘 - 在线考试系统{% endblock %}
{% block content %}
<h2>📊 仪表盘</h2>
<div class="card-grid">
  <div class="card stat-card">
    <div class="stat-num" id="statExams">-</div>
    <div class="stat-label">考试总数</div>
  </div>
  <div class="card stat-card">
    <div class="stat-num" id="statAvg">-</div>
    <div class="stat-label">平均分</div>
  </div>
  <div class="card stat-card">
    <div class="stat-num" id="statPass">-</div>
    <div class="stat-label">及格率(%)</div>
  </div>
  <div class="card stat-card">
    <div class="stat-num" id="statCerts">-</div>
    <div class="stat-label">我的证书</div>
  </div>
</div>

<h3>考试列表</h3>
<table class="table">
  <thead>
    <tr><th>ID</th><th>考试名称</th><th>时长</th><th>状态</th><th>操作</th></tr>
  </thead>
  <tbody id="examTable"></tbody>
</table>
{% endblock %}

{% block scripts %}
<script>
async function loadDashboard() {
  const token = localStorage.getItem('access_token');
  const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

  const [examRes, certRes] = await Promise.all([
    fetch('/api/exams?page=1&page_size=100', { headers }),
    fetch('/api/grades/certificates', { headers })
  ]);
  const examData = (await examRes.json()).data;
  const certs = (await certRes.json()).data || [];

  document.getElementById('statExams').textContent = examData?.total ?? 0;
  document.getElementById('statCerts').textContent = certs.length;

  const tbody = document.getElementById('examTable');
  tbody.innerHTML = '';
  (examData?.items || []).forEach(e => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${e.id}</td><td>${e.title}</td><td>${e.duration_minutes} 分钟</td>
      <td><span class="badge badge-${e.status}">${e.status}</span></td>
      <td>
        ${e.status === 'published'
          ? `<a class="btn btn-sm" href="/exam/${e.id}/take">开始考试</a>`
          : `<span class="muted">${e.status === 'draft' ? '未发布' : '已结束'}</span>`}
      </td>`;
    tbody.appendChild(tr);
  });
}
loadDashboard();
</script>
{% endblock %}
