{% extends "base.html" %}
{% block title %}考试中心 - 在线考试系统{% endblock %}
{% block content %}
<h2>🎯 考试中心</h2>
<div class="toolbar">
  <button class="btn" onclick="loadExams('published')">进行中</button>
  <button class="btn" onclick="loadExams('draft')">未发布</button>
  <button class="btn" onclick="loadExams('ended')">已结束</button>
  <span class="spacer"></span>
  {% if role in ['admin','teacher'] %}
  <button class="btn btn-primary" onclick="showCreateForm()">+ 创建考试</button>
  {% endif %}
</div>
<table class="table">
  <thead>
    <tr><th>ID</th><th>考试名称</th><th>类型</th><th>时长</th><th>总分</th><th>及格分</th><th>状态</th><th>操作</th></tr>
  </thead>
  <tbody id="examTable"></tbody>
</table>

<div id="createModal" class="modal hidden">
  <div class="modal-content">
    <h3>创建考试</h3>
    <div class="form-group"><label>名称</label><input id="cTitle"></div>
    <div class="form-group"><label>科目ID</label><input id="cSubject" value="1" type="number"></div>
    <div class="form-group"><label>时长(分钟)</label><input id="cDuration" value="60" type="number"></div>
    <div class="form-group"><label>总分</label><input id="cTotal" value="100" type="number"></div>
    <div class="form-group"><label>及格分</label><input id="cPass" value="60" type="number"></div>
    <div class="form-group"><label>题型</label>
      <select id="cType">
        <option value="formal">正式考试</option>
        <option value="practice">练习</option>
        <option value="mock">模拟考</option>
      </select>
    </div>
    <div class="form-group">
      <label><input type="checkbox" id="cAntiCheat" checked> 开启防作弊</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="createExam()">创建</button>
      <button class="btn" onclick="closeCreate()">取消</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const token = localStorage.getItem('access_token');
const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
const role = localStorage.getItem('user_role') || 'student';
let currentStatus = 'published';

async function loadExams(status) {
  currentStatus = status;
  const res = await fetch(`/api/exams?status=${status}&page=1&page_size=100`, { headers });
  const data = (await res.json()).data;
  const tbody = document.getElementById('examTable');
  tbody.innerHTML = '';
  (data?.items || []).forEach(e => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${e.id}</td><td>${e.title}</td><td>${e.exam_type}</td>
      <td>${e.duration_minutes}分钟</td><td>${e.total_score}</td><td>${e.pass_score}</td>
      <td><span class="badge badge-${e.status}">${e.status}</span></td>
      <td>
        ${e.status === 'published'
          ? `<a class="btn btn-sm btn-primary" href="/exam/${e.id}/take">开始考试</a>
             <a class="btn btn-sm" href="/result/0" onclick="alert('提交后查看成绩')">成绩</a>`
          : `<button class="btn btn-sm" onclick="publishExam(${e.id})">发布</button>`}
      </td>`;
    tbody.appendChild(tr);
  });
}

async function publishExam(id) {
  await fetch(`/api/exams/${id}`, {
    method: 'PUT', headers, body: JSON.stringify({ status: 'published' })
  });
  loadExams(currentStatus);
}

function showCreateForm() { document.getElementById('createModal').classList.remove('hidden'); }
function closeCreate() { document.getElementById('createModal').classList.add('hidden'); }

async function createExam() {
  const body = {
    title: document.getElementById('cTitle').value,
    subject_id: parseInt(document.getElementById('cSubject').value),
    duration_minutes: parseInt(document.getElementById('cDuration').value),
    total_score: parseInt(document.getElementById('cTotal').value),
    pass_score: parseInt(document.getElementById('cPass').value),
    exam_type: document.getElementById('cType').value,
    anti_cheat_enabled: document.getElementById('cAntiCheat').checked ? 1 : 0,
  };
  const res = await fetch('/api/exams', { method: 'POST', headers, body: JSON.stringify(body) });
  const data = await res.json();
  if (data.code === 0) { closeCreate(); loadExams(currentStatus); alert('考试已创建，请到题库添加题目后发布'); }
  else alert(data.detail || '创建失败');
}

loadExams('published');
</script>
{% endblock %}
